<!DOCTYPE html>

<html lang="en">
    <head>
        <title>First Web Page</title>
    </head>

    <body>
        <h1>Courses:</h1>
        <ul>
            {% for i in course %}
            <h2>{{loop.index0}}. {{i}}</h2>
            {% endfor %}
        </ul>

        <hr>

        <h1>Student Details:</h1>
        <ul>
            {% for key, value in student.items() %}
            <li><h2>{{key}} : {{value}}</h2></li>
            {% endfor %}
        </ul>
        
    </body>
</html>

<!DOCTYPE html>

<html lang="en">
    <head>
        <title>First Web Page</title>
    </head>

    <body>
        <!-- Comments in HTML -->
        <!-- {# Comments in Jinja #} -->
        {# Comments in Jinja #}
        <h1>Hello, {{f_name + " " + l_name}}!</h1>
        <h2>Name: {{f_name | upper}}_{{l_name | lower}}</h2>
        <h2>Course: {{course}}</h2>
        <h2>City: {{city}}</h2>
        <h2>Age: {{age}}</h2>
        <h2>Original Fee: {{fee}}</h2>
        <h2>GST Included Fee: {{fee+90}}</h2>
        <h2>Technical Skills: {{skills_set}}</h2>
        <h2>Total Skills: {{skills_set | length}}</h2>
    </body>
</html>
